# Static analysis. There was no SAST of any kind: no CodeQL, bandit, semgrep or
# secret scanning, so dependency CVEs caught by the container image scan were
# the only automated security signal.

name: CodeQL

on:
  # CI runs only on demand: on a pull request labelled "run-ci" (adding the
  # label starts it, and later pushes rerun it), or by hand from the Actions
  # tab. Pushes and pull requests without the label run nothing.
  pull_request:
    branches: [dev/v2.0, "2.0"]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended adds the lower-severity rules; worth the extra
          # runtime on an HR codebase holding payroll and bank details.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
