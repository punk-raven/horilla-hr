# Railway config for the `web` service. See docker/README.md, "Deploying on
# Railway", for the full topology and the variables each service needs.
#
# The `scheduler` service reads railway.scheduler.toml instead; set that path
# under the service's Settings -> Config-as-code.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand: on Railway a start command replaces the image ENTRYPOINT,
# and web needs docker/entrypoint.sh to wait for Postgres, migrate and
# collectstatic before gunicorn starts.
healthcheckPath = "/health/"
# A first boot applies every migration and runs collectstatic --clear.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
